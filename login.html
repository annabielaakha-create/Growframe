<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Masuk — Annabil Personal Dashboard</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --line:#242a32;
    --text:#e8ecf1; --muted:#8b95a3; --accent:#7c5cff; --danger:#ff5f6d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--text); padding:24px;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .card{
    width:100%; max-width:360px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:28px;
  }
  .mark{
    width:38px; height:38px; border-radius:10px; margin-bottom:18px;
    background:linear-gradient(135deg,var(--accent),#3ad1c6);
  }
  h1{font-size:19px; margin:0 0 4px; letter-spacing:-.01em}
  p{margin:0 0 22px; color:var(--muted); font-size:13px}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:7px}
  input{
    width:100%; padding:12px 14px; border-radius:10px; font-size:15px;
    background:#0e1116; border:1px solid var(--line); color:var(--text);
  }
  input:focus{outline:none; border-color:var(--accent)}
  button{
    width:100%; margin-top:16px; padding:12px; border:0; border-radius:10px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled{opacity:.55; cursor:default}
  .err{margin-top:14px; font-size:13px; color:var(--danger); min-height:18px}
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="mark"></div>
    <h1>Annabil Personal Dashboard</h1>
    <p>Area privat. Masukkan kata sandi untuk melanjutkan.</p>
    <label for="pw">Kata sandi</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="btn" type="submit">Masuk</button>
    <div class="err" id="err"></div>
  </form>

<script>
  const form = document.getElementById('form');
  const btn  = document.getElementById('btn');
  const err  = document.getElementById('err');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Memeriksa…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value })
      });
      if (res.ok) {
        const info = await res.json().catch(() => ({}));
        const home = info.home || '/dash/';
        const next = new URLSearchParams(location.search).get('next');
        // Klien hanya boleh mendarat di areanya sendiri.
        const allowed = info.role === 'cece'
          ? (next && next.startsWith('/dash/cece') ? next : home)
          : (next && next.startsWith('/') ? next : home);
        location.href = allowed;
        return;
      }
      err.textContent = res.status === 401
        ? 'Kata sandi salah.'
        : 'Server belum dikonfigurasi. Cek variable DASH_PASSWORD.';
    } catch {
      err.textContent = 'Gagal terhubung. Coba lagi.';
    }
    btn.disabled = false;
    btn.textContent = 'Masuk';
  });
</script>
</body>
</html>
