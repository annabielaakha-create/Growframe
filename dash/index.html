<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100D18">
<title>GrowFrame — Personal Creative Workspace</title>
<link rel="apple-touch-icon" href="/dash-icon.png">
<link rel="icon" type="image/png" href="/dash-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GrowFrame">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{
  --bg:#100D18; --bg2:#181323; --bg3:#1F1830;
  --accent:#8B5CF6; --accent2:#B9A2FF;
  --text:#F5F3FA; --muted:#A7A0B5;
  --line:rgba(185,162,255,.13);
  --line2:rgba(185,162,255,.22);
  --ok:#4ADE80; --warn:#FBBF24; --danger:#FB7185; --info:#60A5FA;
  --r:14px; --r2:18px;
  --side:236px;
  --glass:linear-gradient(160deg,rgba(185,162,255,.07),rgba(185,162,255,.02));
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 12% -8%,rgba(139,92,246,.20),transparent 60%),
    radial-gradient(700px 450px at 100% 0%,rgba(185,162,255,.10),transparent 55%);
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(185,162,255,.18);border-radius:9px}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:flex;min-height:100vh}

.side{
  position:fixed; inset:0 auto 0 0; width:var(--side); z-index:40;
  display:flex; flex-direction:column; gap:4px; padding:18px 12px;
  background:rgba(16,13,24,.86); backdrop-filter:blur(18px);
  border-right:1px solid var(--line); transition:transform .22s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:29px;height:23px;flex:none;color:#fff;
  filter:drop-shadow(0 0 10px rgba(185,162,255,.45))}
.brand b{font-size:15.5px;letter-spacing:-.02em;font-weight:650}
.navlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);opacity:.65;padding:12px 10px 5px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  border:0;background:none;border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:14px;text-align:left;transition:.14s}
.nav:hover{background:rgba(185,162,255,.06);color:var(--text)}
.nav.on{background:linear-gradient(90deg,rgba(139,92,246,.22),rgba(139,92,246,.06));
  color:var(--text);font-weight:550;box-shadow:inset 0 0 0 1px var(--line2)}
.nav svg{width:16px;height:16px;flex:none;opacity:.9}
.nav .ct{margin-left:auto;font-size:11px;color:var(--muted);
  background:rgba(185,162,255,.10);padding:1px 7px;border-radius:99px}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}

.scrim{position:fixed;inset:0;background:rgba(8,6,13,.6);backdrop-filter:blur(2px);
  z-index:35;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}

.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:13px 22px; background:rgba(16,13,24,.78); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:9px;
  padding:6px 9px;cursor:pointer;color:var(--muted)}
.searchbox{position:relative;flex:1;max-width:420px;margin-left:auto}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--muted);pointer-events:none}
.searchbox input{width:100%;padding:8px 12px 8px 32px;border-radius:10px;
  background:rgba(185,162,255,.06);border:1px solid var(--line);font-size:13.5px}
.searchbox input:focus{outline:none;border-color:var(--line2);background:rgba(185,162,255,.09)}
.kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10.5px;
  color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.clock{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.page{padding:22px;max-width:1320px;width:100%}
.phead{margin:0 0 18px}
.phead h2{font-size:21px;margin:0 0 3px;letter-spacing:-.02em;font-weight:650}
.phead p{margin:0;color:var(--muted);font-size:13.5px}

/* ---------- atoms ---------- */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r2);
  padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.spread{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mt{margin-top:11px}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:0;
  border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:580;
  background:linear-gradient(145deg,var(--accent),#7048E8);color:#fff;
  box-shadow:0 6px 18px -8px var(--accent);transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(185,162,255,.07);color:var(--text);
  border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.ghost:hover{background:rgba(185,162,255,.12)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.danger{background:rgba(251,113,133,.14);color:var(--danger);
  border:1px solid rgba(251,113,133,.3);box-shadow:none}
.ico{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;
  cursor:pointer;color:var(--muted);font-size:12px;transition:.14s;white-space:nowrap}
.ico:hover{color:var(--text);border-color:var(--line2);background:rgba(185,162,255,.07)}
.ico.red:hover{color:var(--danger);border-color:rgba(251,113,133,.4)}

label.f{display:block;font-size:11.5px;color:var(--muted);margin:0 0 5px;
  text-transform:uppercase;letter-spacing:.06em}
.in{width:100%;padding:9px 12px;border-radius:10px;background:rgba(10,8,16,.6);
  border:1px solid var(--line);font-size:14px}
.in:focus{outline:none;border-color:var(--accent);background:rgba(10,8,16,.85)}
textarea.in{min-height:92px;resize:vertical;line-height:1.6}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2.5px 9px;
  border-radius:99px;background:rgba(185,162,255,.09);border:1px solid var(--line);
  color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(139,92,246,.26);color:var(--text);border-color:var(--line2)}
.tag{font-size:10.5px;padding:1.5px 7px;border-radius:99px;
  background:rgba(185,162,255,.09);color:var(--muted);border:1px solid var(--line)}
.dotbadge{width:6px;height:6px;border-radius:99px;flex:none}

.st{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:550;white-space:nowrap}
.st-planning{background:rgba(167,160,181,.15);color:var(--muted)}
.st-progress{background:rgba(96,165,250,.16);color:var(--info)}
.st-review{background:rgba(251,191,36,.16);color:var(--warn)}
.st-completed{background:rgba(74,222,128,.15);color:var(--ok)}
.pr-high{color:var(--danger)} .pr-med{color:var(--warn)} .pr-low{color:var(--muted)}

.bar{height:5px;border-radius:99px;background:rgba(185,162,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}

.item{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:12px;
  border:1px solid var(--line);background:rgba(185,162,255,.035);transition:.14s}
.item:hover{border-color:var(--line2);background:rgba(185,162,255,.06)}
.item + .item{margin-top:8px}
.item .grow{flex:1;min-width:0}
.ttl{font-weight:570;font-size:14px;word-break:break-word}

.empty{text-align:center;padding:38px 16px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:4px;font-weight:570}

.hero{position:relative;overflow:hidden;border-radius:var(--r2);padding:24px;
  border:1px solid var(--line2);
  background:linear-gradient(135deg,rgba(139,92,246,.42),rgba(91,60,190,.22) 55%,rgba(24,19,35,.6))}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;
  border-radius:50%;background:radial-gradient(circle,rgba(185,162,255,.4),transparent 65%)}
.hero h3{margin:0 0 7px;font-size:23px;letter-spacing:-.03em}
.hero p{margin:0 0 15px;color:#E6E0F7;font-size:13.5px;max-width:420px}

/* ---------- kanban / calendar ---------- */
.kan{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:12px;
  overflow-x:auto;padding-bottom:6px}
.kcol{background:rgba(185,162,255,.04);border:1px solid var(--line);
  border-radius:var(--r);padding:11px;min-height:150px}
.kcol h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);display:flex;justify-content:space-between}
.kcard{background:rgba(24,19,35,.9);border:1px solid var(--line);border-radius:11px;
  padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.14s}
.kcard:hover{border-color:var(--line2);transform:translateY(-1px)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);text-align:center;padding:4px 0}
.cday{min-height:72px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;
  background:rgba(185,162,255,.03);font-size:11.5px}
.cday.out{opacity:.32}
.cday.today{border-color:var(--accent);background:rgba(139,92,246,.12)}
.cday .n{color:var(--muted);font-size:11px}
.cev{margin-top:3px;font-size:10.5px;padding:1.5px 5px;border-radius:5px;
  background:rgba(139,92,246,.26);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- project table (Wrike-style) ---------- */
.ptable{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
  background:var(--glass);box-shadow:var(--shadow)}
.pscroll{overflow-x:auto}
.ptable .thead,.prow{display:grid;align-items:center;
  grid-template-columns:26px minmax(210px,2.1fr) minmax(120px,1fr) 118px 126px 110px 92px 84px;
  gap:10px;padding:9px 14px;min-width:960px}
.ptable .thead{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);border-bottom:1px solid var(--line);background:rgba(185,162,255,.04)}
.pgroup{border-top:1px solid var(--line)}
.pgroup:first-of-type{border-top:0}
.ghead{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;
  background:rgba(185,162,255,.05);font-size:12.5px;font-weight:600;
  position:sticky;left:0;transition:.14s}
.ghead:hover{background:rgba(185,162,255,.09)}
.ghead .caret{width:13px;color:var(--muted);transition:transform .16s;display:inline-block}
.ghead.closed .caret{transform:rotate(-90deg)}
.ghead .ct{font-size:11px;color:var(--muted);background:rgba(185,162,255,.12);
  padding:0 8px;border-radius:99px;font-weight:500}
.pgroup.over .ghead{background:rgba(139,92,246,.26);box-shadow:inset 0 0 0 1px var(--accent)}
.pgroup.over .gbody{background:rgba(139,92,246,.08)}
.gbody{min-height:6px}
.pgroup.closed .gbody{display:none}
.prow{border-top:1px solid rgba(185,162,255,.07);font-size:13px;transition:.12s}
.prow:hover{background:rgba(185,162,255,.05)}
.prow.dragging{opacity:.32}
.grip{cursor:grab;color:var(--muted);opacity:.5;text-align:center;font-size:14px;
  touch-action:none;user-select:none;-webkit-user-select:none;line-height:1}
.grip:active{cursor:grabbing}
.prow:hover .grip{opacity:1}
.pname{font-weight:560;cursor:pointer}
.pname:hover{color:var(--accent2)}
.pghost{position:fixed;z-index:90;pointer-events:none;padding:8px 14px;border-radius:11px;
  background:#241C3C;border:1px solid var(--accent);font-size:13px;font-weight:560;
  box-shadow:0 14px 36px -10px rgba(0,0,0,.8);max-width:260px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gempty{padding:10px 14px 12px 40px;color:var(--muted);font-size:12px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;
  justify-content:center;padding:18px;background:rgba(8,6,13,.66);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.sheet{width:100%;max-width:540px;max-height:88vh;overflow:auto;border-radius:20px;
  background:linear-gradient(170deg,#1D1730,#15111F);border:1px solid var(--line2);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.8);padding:20px}
.sheet h3{margin:0 0 3px;font-size:17px;letter-spacing:-.02em}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.fgrid{display:grid;gap:11px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);z-index:80;
  background:#221B36;border:1px solid var(--line2);padding:10px 18px;border-radius:99px;
  font-size:13px;transition:transform .24s;box-shadow:var(--shadow)}
.toast.on{transform:translate(-50%,0)}

.qa{position:fixed;right:20px;bottom:20px;z-index:50;display:none;
  width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;font-size:24px;
  background:linear-gradient(145deg,var(--accent),#7048E8);color:#fff;
  box-shadow:0 12px 30px -8px var(--accent)}

/* ---------- responsive ---------- */
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .side{transform:translateX(-100%)} .side.open{transform:none}
  main{margin-left:0} .burger{display:block} .qa{display:block}
  .top{padding:11px 14px} .page{padding:15px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .clock{display:none}
  .top .btn{display:none}
  .cday{min-height:58px}
}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 80" fill="currentColor" aria-hidden="true">
        <path d="M30 0H60V21H21V57H0V30Z"/>
        <path d="M62 24H100V57L77 80H23V59H79V45H62Z"/>
      </svg><b>growframe.</b></div>
    <div id="navWrap"></div>
    <div class="foot">
      <button class="nav" data-go="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.63.67 1.09 1.31 1.1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
      <button class="nav" id="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <main>
    <header class="top">
      <button class="burger" id="burger">☰</button>
      <h1 id="ptitle">Overview</h1>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="gsearch" placeholder="Cari project, notes, prompt, aset…" autocomplete="off">
        <span class="kbd">/</span>
      </div>
      <button class="btn" id="quickAdd">+ Quick Add</button>
      <span class="clock" id="clock"></span>
    </header>
    <div class="page" id="view"></div>
  </main>
</div>

<button class="qa" id="qaFab">+</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ util ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let tTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('on'),1900)}
function rupiah(n){const v=Number(n)||0;
  return 'Rp '+v.toLocaleString('id-ID',{maximumFractionDigits:0})}
function dateID(s){if(!s)return '—';
  return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function daysTo(s){if(!s)return null;
  return Math.ceil((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}
async function copyText(t){
  try{await navigator.clipboard.writeText(t)}catch{
    const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;
    document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  toast('Disalin')}

/* ============ data ============ */
const COLS=['projects','tasks','notes','clips','prompts','assets','finance'];
const DB={projects:[],tasks:[],notes:[],clips:[],prompts:[],assets:[],finance:[],settings:{}};
const saveTimers={};

async function api(path,opt={}){
  const r=await fetch(path,{headers:opt.body?{'Content-Type':'application/json'}:{},...opt});
  if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname);throw 0}
  if(!r.ok)throw new Error(path+' '+r.status);
  return r.json();
}
async function loadAll(){
  const res=await Promise.all([...COLS,'settings'].map(c=>api('/api/data/'+c).catch(()=>null)));
  [...COLS,'settings'].forEach((c,i)=>{if(res[i]!=null)DB[c]=res[i]});
}
function save(col){
  clearTimeout(saveTimers[col]);
  saveTimers[col]=setTimeout(async()=>{
    try{await api('/api/data/'+col,{method:'PUT',body:JSON.stringify(DB[col])})}
    catch{toast('Gagal menyimpan '+col)}
  },320);
}
function commit(col,msg){ save(col); render(); if(msg)toast(msg) }

/* ============ nav ============ */
const I={

  const d=p.deliverables||[]; if(d.length)return Math.round(d.filter(x=>x.done).length/d.length*100);

  DB.projects.filter(p=>!p.archived).map(p=>`<option value="${p.id}"${sel===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}

function pGroup(key,label,rows){

    <div class="gbody">${rows.map(pRow).join('')||
      '<div class="gempty">Belum ada project di sini — geser salah satu ke grup ini.</div>'}</div>

function pRow(p){

    :dateID(p.deadline);
  const done=(p.deliverables||[]).filter(x=>x.done).length, tot=(p.deliverables||[]).length;
  const pay={Lunas:'var(--ok)',DP:'var(--warn)',Belum:'var(--muted)'}[p.payment]||'var(--muted)';
  return `<div class="prow" data-row="${p.id}">
    <span class="grip" data-grip="${p.id}" title="Geser untuk pindah status">⠿</span>

      <span class="xs muted">${tot?done+'/'+tot:prog+'%'}</span></span>
    <span class="sm muted">${p.budget?rupiah(p.budget):'—'}</span>
    <span class="xs" style="color:${pay}">${esc(p.payment||'Belum')}</span>
    <span class="row" style="gap:5px;flex-wrap:nowrap;justify-content:flex-end">
      <button class="ico" data-arch="${p.id}">${p.archived?'↩':'⌫'}</button>
      <button class="ico red" data-del="projects:${p.id}">×</button></span>
  </div>`;
}

/* --- drag antar grup: pointer events, jalan di iPad maupun desktop --- */
(function(){
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    const g=e.target.closest('[data-grip]'); if(!g)return;
    e.preventDefault();
    const p=DB.projects.find(x=>x.id===g.dataset.grip); if(!p)return;
    const row=g.closest('.prow');
    drag={id:p.id,from:p.status||'planning',row,ghost:null,over:null};
    g.setPointerCapture(e.pointerId);
    const ghost=document.createElement('div');
    ghost.className='pghost'; ghost.textContent=p.name;
    document.body.appendChild(ghost); drag.ghost=ghost;
    moveGhost(e); row.classList.add('dragging');
  });
  function moveGhost(e){
    if(!drag)return;
    drag.ghost.style.left=(e.clientX+14)+'px';
    drag.ghost.style.top=(e.clientY-14)+'px';
  }
  document.addEventListener('pointermove',e=>{
    if(!drag)return;
    moveGhost(e);
    drag.ghost.style.display='none';
    const el=document.elementFromPoint(e.clientX,e.clientY);
    drag.ghost.style.display='';
    const grp=el&&el.closest?el.closest('.pgroup'):null;
    if(grp!==drag.over){
      if(drag.over)drag.over.classList.remove('over');
      drag.over=grp; if(grp)grp.classList.add('over');
    }
  });
  function finish(){
    if(!drag)return;
    const target=drag.over&&drag.over.dataset.group;
    drag.ghost.remove(); drag.row.classList.remove('dragging');
    if(drag.over)drag.over.classList.remove('over');
    const d=drag; drag=null;
    if(target&&target!==d.from){
      const p=DB.projects.find(x=>x.id===d.id);
      p.status=target; p.updatedAt=new Date().toISOString();
      commit('projects','Dipindah ke '+stLabel(target));
    }
  }
  document.addEventListener('pointerup',finish);
  document.addEventListener('pointercancel',finish);
})();

let tView='kanban', tFilter='all';
function vTasks(){
  let list=[...DB.tasks];
  if(tFilter==='today')list=list.filter(t=>t.due&&t.due<=today()&&t.status!=='done');
  if(tFilter==='high')list=list.filter(t=>t.priority==='high'&&t.status!=='done');
  if(tFilter==='open')list=list.filter(t=>t.status!=='done');

  return `<div class="phead spread"><div><h2>Tasks & Calendar</h2>
    <p>Pecah pekerjaan jadi langkah yang bisa dicentang.</p></div>

        {all:'Semua',open:'Belum selesai',today:'Hari ini',high:'Prioritas tinggi'}[f]}</span>`).join('')}</div>
    <div class="row">${['kanban','list','calendar'].map(v=>
      `<span class="chip${tView===v?' on':''}" data-tv="${v}">${

  </div>
  ${tView==='kanban'?kanban(list):tView==='list'?taskList(list):calendar()}`;

function kanban(list){
  const cols=[['todo','Inbox'],['doing','In Progress'],['review','Review'],['done','Completed']];
  return `<div class="kan">${cols.map(([k,l])=>{
    const its=list.filter(t=>(t.status||'todo')===k);
    return `<div class="kcol"><h4>${l}<span>${its.length}</span></h4>
      ${its.map(t=>`<div class="kcard" data-open-task="${t.id}">
        <div style="font-weight:550;font-size:13px">${esc(t.title)}</div>
        <div class="xs muted" style="margin-top:4px">${projName(t.projectId)}</div>
        <div class="row xs" style="margin-top:6px;gap:7px">
          ${t.due?`<span class="tag">${dateID(t.due)}</span>`:''}
          <span class="tag pr-${t.priority||'low'}">${t.priority||'low'}</span></div>
      </div>`).join('')||'<div class="xs muted" style="padding:6px 2px">Kosong</div>'}
    </div>`}).join('')}</div>`;
}
function taskList(list){
  if(!list.length)return empty('Tidak ada task','Tambahkan lewat + Task.');
  return list.map(t=>`<div class="item">
    <input type="checkbox" data-done="${t.id}" ${t.status==='done'?'checked':''} style="margin-top:3px">
    <div class="grow"><div class="ttl ${t.status==='done'?'muted':''}"
      style="${t.status==='done'?'text-decoration:line-through':''}">${esc(t.title)}</div>
      <div class="xs muted">${projName(t.projectId)} · ${t.due?dateID(t.due):'tanpa tenggat'}
        · <span class="pr-${t.priority||'low'}">${t.priority||'low'}</span></div></div>
    <button class="ico" data-open-task="${t.id}">Edit</button>
    <button class="ico red" data-del="tasks:${t.id}">Hapus</button></div>`).join('');
}
function calendar(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const dows=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const iso=d.toISOString().slice(0,10);
    const evs=[...DB.tasks.filter(t=>t.due===iso).map(t=>t.title),
      ...DB.projects.filter(p=>p.deadline===iso&&!p.archived).map(p=>'◆ '+p.name)];
    cells+=`<div class="cday${d.getMonth()!==m?' out':''}${iso===today()?' today':''}">
      <div class="n">${d.getDate()}</div>
      ${evs.slice(0,3).map(e=>`<div class="cev">${esc(e)}</div>`).join('')}
      ${evs.length>3?`<div class="xs muted">+${evs.length-3}</div>`:''}</div>`;
  }
  return `<div class="card"><div class="spread" style="margin-bottom:11px">
    <b>${now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b>
    <span class="xs muted">◆ deadline project</span></div>
    <div class="cal">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>`;
}

function vTransfer(){
  return `<div class="phead"><h2>File Transfer</h2>
    <p>Unggah dari iPad, unduh di PC. Maksimal 100 MB per file.</p></div>
  <div class="card">
    <div id="drop" style="border:1.5px dashed var(--line2);border-radius:14px;padding:30px 16px;
      text-align:center;color:var(--muted);cursor:pointer">
      Ketuk untuk pilih file, atau seret ke sini
      <div class="xs" style="margin-top:5px">File besar sebaiknya lewat Drive, simpan linknya di Asset Library</div></div>
    <input type="file" id="picker" multiple hidden>
    <div class="bar mt" id="barWrap" style="display:none"><i id="bar" style="width:0"></i></div>
    <div class="xs muted" id="upStatus" style="text-align:center;margin-top:7px"></div></div>
  <div class="navlbl" style="padding-left:2px">File tersimpan</div>
  <div id="fileList"></div>`;
}
async function loadFiles(){
  const box=$('#fileList'); if(!box)return;
  let files=[]; try{files=await api('/api/files')}catch{box.innerHTML=empty('Gagal memuat','');return}
  box.innerHTML=files.length?files.map(f=>`<div class="item">
    <div class="grow"><div class="ttl trunc">${esc(f.name)}</div>
      <div class="xs muted">${fmtSize(f.size)} · ${new Date(f.uploaded).toLocaleString('id-ID',
        {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>
    <button class="ico" data-flink="${esc(f.key)}">Salin link</button>
    <a class="ico" href="/api/file?key=${encodeURIComponent(f.key)}">Unduh</a>
    <button class="ico red" data-fdel="${esc(f.key)}">Hapus</button></div>`).join('')
    :empty('Belum ada file','Unggah file pertama di atas.');
}
function fmtSize(b){if(b==null)return '';const u=['B','KB','MB','GB'];let i=0,n=b;
  while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(n<10&&i>0?1:0)+' '+u[i]}
function uploadOne(file){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('PUT','/api/files?name='+encodeURIComponent(file.name));
    x.setRequestHeader('Content-Type',file.type||'application/octet-stream');
    x.upload.onprogress=e=>{if(e.lengthComputable)$('#bar').style.width=(e.loaded/e.total*100)+'%'};
    x.onload=()=>x.status<300?res():rej(new Error(x.status));
    x.onerror=()=>rej(new Error('network')); x.send(file)});
}
async function handleFiles(fl){
  const files=[...fl]; if(!files.length)return;
  $('#barWrap').style.display='block';
  for(let i=0;i<files.length;i++){
    $('#upStatus').textContent='Mengunggah '+files[i].name+' ('+(i+1)+'/'+files.length+')';
    $('#bar').style.width='0';
    try{await uploadOne(files[i])}catch{$('#upStatus').textContent='Gagal: '+files[i].name;
      await new Promise(r=>setTimeout(r,1500))}
  }
  $('#barWrap').style.display='none'; $('#upStatus').textContent='';
  toast('Unggahan selesai'); loadFiles();
}

/* ============ GLOBAL SEARCH ============ */
function vSearch(){
  const q=searchQ.toLowerCase(); if(!q)return empty('Ketik untuk mencari','');
  const hit=(arr,f,type,g)=>arr.filter(x=>f(x).toLowerCase().includes(q))
    .slice(0,8).map(x=>({t:f(x).slice(0,70),type,g}));
  const res=[
    ...hit(DB.projects,p=>p.name+' '+(p.client||''),'Project','projects'),
    ...hit(DB.tasks,t=>t.title,'Task','tasks'),
    ...hit(DB.notes,n=>(n.title||'')+' '+(n.body||''),'Note','notes'),
    ...hit(DB.clips,c=>(c.label||'')+' '+c.text,'Clipboard','clips'),
    ...hit(DB.prompts,p=>p.title+' '+p.positive,'Prompt','prompts'),
    ...hit(DB.assets,a=>a.label+' '+(a.note||''),'Asset','assets'),
    ...hit(DB.finance,f=>f.label,'Finance','finance')];
  return `<div class="phead"><h2>Hasil untuk "${esc(searchQ)}"</h2>
    <p>${res.length} item ditemukan.</p></div>
    ${res.length?res.map(r=>`<div class="item" data-go="${r.g}" style="cursor:pointer">
      <span class="tag" style="margin-top:2px">${r.type}</span>
      <div class="grow"><div class="trunc">${esc(r.t)}</div></div></div>`).join('')
    :empty('Tidak ada yang cocok','Coba kata kunci lain.')}`;
}

      tags:$('#f_tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      projectId:$('#f_proj').value,note:$('#f_note').value.trim()}),
    valid:v=>!!v.label&&!!v.url,col:'assets'}),

  finance:(f={})=>({title:'Transaksi Baru',sub:'Catat pemasukan atau pengeluaran.',
    body:`<div class="fgrid">
      <div><label class="f">Jenis</label><select class="in" id="f_type">
        <option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select></div>
      <div><label class="f">Jumlah (Rp)</label><input class="in" type="number" id="f_amt"></div>
      <div class="full"><label class="f">Keterangan</label><input class="in" id="f_label"></div>
      <div><label class="f">Tanggal</label><input class="in" type="date" id="f_date" value="${today()}"></div>
      <div><label class="f">Project</label><select class="in" id="f_proj">${projOptions()}</select></div>
      <div class="full"><label class="f">Kategori</label><input class="in" id="f_cat" placeholder="software, transport, fee editor"></div></div>`,
    read:()=>({type:$('#f_type').value,amount:Number($('#f_amt').value||0),
      label:$('#f_label').value.trim(),date:$('#f_date').value,
      projectId:$('#f_proj').value,category:$('#f_cat').value.trim()}),
    valid:v=>!!v.label&&v.amount>0,col:'finance'})
};

function form(kind,existing){
  const f=FORMS[kind](existing||{});
  openSheet(`<h3>${f.title}</h3><div class="sub">${f.sub}</div>${f.body}
    <div class="row" style="justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" id="mCancel">Batal</button>
      <button class="btn" id="mSave">Simpan</button></div>`);
  $('#mCancel').onclick=closeSheet;
  $('#mSave').onclick=()=>{
    const v=f.read();
    if(!f.valid(v))return toast('Lengkapi dulu field wajibnya');
    if(existing&&existing.id){
      Object.assign(DB[f.col].find(x=>x.id===existing.id),v,{updatedAt:new Date().toISOString()});
    }else{
      const id=uid();
      DB[f.col].unshift({id,...v,createdAt:v.createdAt||new Date().toISOString(),
        updatedAt:new Date().toISOString()});
      if(f.after){closeSheet();save(f.col);return f.after(id)}
    }
    closeSheet(); commit(f.col,'Tersimpan');
  };
  setTimeout(()=>{const a=$('#sheet .in');a&&a.focus()},60);
}

let sheetProj=null;
function openProjSheet(id){
  const p=DB.projects.find(x=>x.id===id); if(!p)return;
  sheetProj=id;
  const done=(p.deliverables||[]).filter(x=>x.done).length, tot=(p.deliverables||[]).length;
  openSheet(`<h3>${esc(p.name)}</h3>
    <div class="sub">${esc(p.client||'Tanpa klien')} ·
      <span class="st st-${p.status||'planning'}">${stLabel(p.status)}</span></div>
    <div class="grid g2" style="gap:9px">
      <div class="item"><div class="grow"><div class="xs muted">Deadline</div>
        <div>${p.deadline?dateID(p.deadline):'—'}</div></div></div>
      <div class="item"><div class="grow"><div class="xs muted">Budget</div>
        <div>${p.budget?rupiah(p.budget):'—'} · ${esc(p.payment||'Belum')}</div></div></div></div>
    <div class="navlbl" style="padding-left:0">Deliverables ${tot?`(${done}/${tot})`:''}</div>
    ${tot?p.deliverables.map((x,i)=>`
      <label class="row" style="gap:9px;flex-wrap:nowrap;margin:6px 0;cursor:pointer">
        <input type="checkbox" data-dl="${p.id}:${i}" ${x.done?'checked':''}>
        <span class="${x.done?'muted':''}"
          style="${x.done?'text-decoration:line-through':''}">${esc(x.text)}</span></label>`).join('')
      :'<div class="xs muted">Belum ada deliverables. Tambahkan lewat Edit.</div>'}
    ${(p.links||[]).length?`<div class="navlbl" style="padding-left:0">Link</div>
      <div class="row">${p.links.map(l=>`<a class="tag" href="${esc(l.url)}" target="_blank"
        rel="noopener">${esc(l.label||'Link')} ↗</a>`).join('')}</div>`:''}
    ${p.notes?`<div class="navlbl" style="padding-left:0">Catatan</div>
      <div class="sm muted" style="white-space:pre-wrap">${esc(p.notes)}</div>`:''}
    <div class="row" style="justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" id="mCancel">Tutup</button>
      <button class="btn" data-edit-proj="${p.id}">Edit</button></div>`);
  $('#mCancel').onclick=()=>{sheetProj=null;closeSheet()};
}

function quickAdd(){
  const opts=[['project','Project'],['task','Task'],['note','Catatan'],['clip','Teks / Prompt'],
    ['prompt','AI Prompt'],['asset','Aset'],['finance','Transaksi']];
  openSheet(`<h3>Quick Add</h3><div class="sub">Apa yang mau kamu simpan?</div>
    <div class="grid g2" style="gap:9px">${opts.map(([k,l])=>
      `<button class="item" data-qa="${k}" style="cursor:pointer;text-align:left">
        <div class="grow"><b style="font-size:13.5px">${l}</b></div></button>`).join('')}</div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn ghost" id="mCancel">Tutup</button></div>`);
  $('#mCancel').onclick=closeSheet;
}

const BRIEF_TPL=`CLIENT:
PROJECT:
DEADLINE:

TUJUAN
-

TARGET AUDIENS
-

KEY MESSAGE
-

DELIVERABLES
-

REFERENSI
-

CATATAN PRODUKSI
-`;

/* ============ events ============ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-go],[data-qa],[data-del],[data-parch],[data-gtoggle],[data-tf],[data-tv],[data-cc],[data-ac],[data-pfav],[data-cpy],[data-pin],[data-note],[data-open-proj],[data-edit-proj],[data-open-task],[data-open-prompt],[data-prcopy],[data-prfav],[data-prdup],[data-acopy],[data-arch],[data-copy-note],[data-flink],[data-fdel],[data-tpl]');
  if(!t)return;
  const d=t.dataset;

  if(d.go){ if($('#modal').classList.contains('on'))closeSheet(); return go(d.go) }
  if(d.qa){ closeSheet(); return form(d.qa) }
  if(d.tpl==='brief'){
    const id=uid();
    DB.notes.unshift({id,title:'Creative Brief',body:BRIEF_TPL,tags:['brief'],
      projectId:'',updatedAt:new Date().toISOString()});
    save('notes'); nOpen=id; return go('notes');
  }
  if(d.del){
    const [col,id]=d.del.split(':');
    if(!confirm('Hapus item ini secara permanen?'))return;
    DB[col]=DB[col].filter(x=>x.id!==id);
    if(col==='notes'&&nOpen===id)nOpen=null;
    return commit(col,'Dihapus');
  }
  if(t.hasAttribute('data-parch')){pArch=d.parch==='1';return render()}
  if(d.gtoggle){pClosed.has(d.gtoggle)?pClosed.delete(d.gtoggle):pClosed.add(d.gtoggle);
    return render()}
  if(d.tf){tFilter=d.tf;return render()}
  if(d.tv){tView=d.tv;return render()}
  if(d.cc){cCat=d.cc;return render()}
  if(d.ac){aCat=d.ac;return render()}
  if(d.pfav!==undefined&&t.hasAttribute('data-pfav')){prFav=d.pfav==='1';return render()}
  if(d.note){nOpen=d.note;return render()}
  if(d.cpy)return copyText(DB.clips.find(c=>c.id===d.cpy).text);
  if(d.pin){const c=DB.clips.find(x=>x.id===d.pin);c.pinned=!c.pinned;return commit('clips')}
  if(d.openProj)return openProjSheet(d.openProj);
  if(d.editProj){sheetProj=null;return form('project',DB.projects.find(p=>p.id===d.editProj))}
  if(d.openTask)return form('task',DB.tasks.find(x=>x.id===d.openTask));
  if(d.openPrompt)return form('prompt',DB.prompts.find(x=>x.id===d.openPrompt));
  if(d.prcopy)return copyText(DB.prompts.find(p=>p.id===d.prcopy).positive);
  if(d.prfav){const p=DB.prompts.find(x=>x.id===d.prfav);p.favorite=!p.favorite;return commit('prompts')}
  if(d.prdup){const p=DB.prompts.find(x=>x.id===d.prdup);
    DB.prompts.unshift({...p,id:uid(),title:p.title+' (copy)',createdAt:new Date().toISOString()});
    return commit('prompts','Diduplikat')}
  if(d.acopy)return copyText(DB.assets.find(a=>a.id===d.acopy).url);
  if(d.copyNote)return copyText(DB.notes.find(n=>n.id===d.copyNote).body||'');
  if(d.arch){const p=DB.projects.find(x=>x.id===d.arch);p.archived=!p.archived;
    return commit('projects',p.archived?'Diarsipkan':'Dipulihkan')}
  if(d.flink)return copyText(location.origin+'/api/file?key='+encodeURIComponent(d.flink));
  if(d.fdel){ if(!confirm('Hapus file ini?'))return;
    await api('/api/files?key='+encodeURIComponent(d.fdel),{method:'DELETE'});
    toast('File dihapus'); return loadFiles() }
});

document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.done){const t=DB.tasks.find(x=>x.id===d.done);
    t.status=e.target.checked?'done':'todo';return commit('tasks')}
  if(d.dl){const [pid,i]=d.dl.split(':');
    const p=DB.projects.find(x=>x.id===pid);
    p.deliverables[+i].done=e.target.checked;
    commit('projects');
    if(sheetProj===pid)openProjSheet(pid);
    return}
});

document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='nSearch'){nQ=e.target.value.toLowerCase();const v=e.target.value;render();
    const el=$('#nSearch');if(el){el.value=v;el.focus()}return}
  if(id==='pSearch'){pQ=e.target.value;render();
    const el=$('#pSearch');if(el){el.value=pQ;el.focus()}return}
  if(id==='cSearch'){cQ=e.target.value.toLowerCase();const v=e.target.value;render();
    const el=$('#cSearch');if(el){el.value=v;el.focus()}return}
  if(id==='prSearch'){prQ=e.target.value.toLowerCase();const v=e.target.value;render();
    const el=$('#prSearch');if(el){el.value=v;el.focus()}return}
  if(id==='aSearch'){aQ=e.target.value.toLowerCase();const v=e.target.value;render();
    const el=$('#aSearch');if(el){el.value=v;el.focus()}return}
  if(['nTitle','nBody','nTags','nProj'].includes(id)){
    const n=DB.notes.find(x=>x.id===nOpen); if(!n)return;
    if(id==='nTitle')n.title=e.target.value;
    if(id==='nBody')n.body=e.target.value;
    if(id==='nTags')n.tags=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);
    if(id==='nProj')n.projectId=e.target.value;
    n.updatedAt=new Date().toISOString();
    const s=$('#nSaved'); if(s){s.textContent='menyimpan…';
      setTimeout(()=>{const x=$('#nSaved');if(x)x.textContent='tersimpan'},700)}
    save('notes');
  }
});

$('#gsearch').addEventListener('input',e=>{
  searchQ=e.target.value.trim();
  if(searchQ.length>=2){route='search';render();$('#gsearch').focus()}
  else if(route==='search'){route='overview';render();$('#gsearch').focus()}
});

$('#quickAdd').onclick=quickAdd;
$('#qaFab').onclick=quickAdd;
$('#burger').onclick=()=>{$('#side').classList.toggle('open');$('#scrim').classList.toggle('on')};
$('#scrim').onclick=closeSide;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};
$('#logout').onclick=async()=>{await fetch('/api/session',{method:'DELETE'});location.href='/login'};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(typing)return;
  if(e.key==='/'){e.preventDefault();$('#gsearch').focus()}
  if(e.key.toLowerCase()==='n'){e.preventDefault();quickAdd()}
  if(e.altKey&&/^[1-9]$/.test(e.key)){const n=NAV[+e.key-1];if(n)go(n.id)}
});

document.addEventListener('click',e=>{
  if(e.target.id==='cQSave'){
    const text=$('#cQuick').value.trim(); if(!text)return toast('Isi teksnya dulu');
    DB.clips.unshift({id:uid(),text,label:$('#cQLabel').value.trim(),
      category:$('#cQCat').value.trim(),pinned:false,createdAt:new Date().toISOString()});
    commit('clips','Tersimpan');
  }
  if(e.target.id==='sSave'){DB.settings.name=$('#sName').value.trim()||'Annabil';
    save('settings');toast('Tersimpan');render()}
  if(e.target.id==='sReload'){loadAll().then(()=>{render();toast('Data dimuat ulang')})}
  if(e.target.id==='sLogout'){fetch('/api/session',{method:'DELETE'}).then(()=>location.href='/login')}
  if(e.target.id==='sExport'){
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='growframe-backup-'+today()+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }
  if(e.target.id==='drop')$('#picker').click();
});
document.addEventListener('change',e=>{
  if(e.target.id==='picker'){handleFiles(e.target.files);e.target.value=''}
});
['dragenter','dragover','dragleave','drop'].forEach(ev=>
  document.addEventListener(ev,e=>{
    const d=$('#drop'); if(!d)return;
    if(ev==='dragover'||ev==='dragenter'){e.preventDefault();d.style.borderColor='var(--accent)'}
    else d.style.borderColor='var(--line2)';
    if(ev==='drop'){e.preventDefault();handleFiles(e.dataTransfer.files)}
  }));

function tick(){const n=new Date();
  $('#clock').textContent=n.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})
    +' · '+n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
tick(); setInterval(tick,30000);

/* ============ boot ============ */
(async()=>{
  const h=(location.hash||'').replace('#/','');
  if(h&&TITLES[h])route=h;
  render();
  await loadAll();
  render();
})();
window.addEventListener('hashchange',()=>{
  const h=(location.hash||'').replace('#/','');
  if(h&&TITLES[h]&&h!==route){route=h;render()}
});
</script>
</body>
</html>
