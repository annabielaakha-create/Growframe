<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100D18">
<title>Project Media Sosial</title>
<link rel="apple-touch-icon" href="/dash-icon.png">
<link rel="icon" type="image/png" href="/dash-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Media Sosial">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#100D18; --bg2:#181323; --card:#1C1630;
  --line:rgba(185,162,255,.14); --line2:rgba(185,162,255,.26);
  --accent:#8B5CF6; --accent2:#B9A2FF; --text:#F5F3FA; --muted:#A49CB4;
  --ok:#4ADE80; --warn:#FBBF24; --danger:#FB7185; --info:#60A5FA; --take:#C084FC;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overflow-x:hidden;overscroll-behavior-y:contain;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(760px 420px at 10% -6%,rgba(139,92,246,.22),transparent 62%),
             radial-gradient(620px 380px at 102% 2%,rgba(185,162,255,.11),transparent 58%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
a{color:var(--accent2);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(185,162,255,.2);border-radius:8px}
.hide{display:none !important}

/* ---------- shell ---------- */
.wrap{position:relative;z-index:1;min-height:100vh;display:flex}

.side{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column}

.top{position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 12px) 18px 12px;
  background:rgba(16,13,24,.82);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.02em}
.top .sub{font-size:12px;color:var(--muted);margin-top:1px}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  padding:5px 11px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.sync i{width:6px;height:6px;border-radius:99px;background:var(--ok);display:block;flex:none}
.sync.busy i{background:var(--warn);animation:pulse 1s infinite}
.sync.err i{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}

.page{padding:18px;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 26px);
  max-width:1180px;width:100%;margin:0 auto}

/* ---------- bottom nav (mobile) ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding-bottom:var(--safe-b);background:rgba(20,16,32,.94);
  backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;color:var(--muted);font-size:10.5px;font-weight:500;
  min-height:var(--nav-h);justify-content:center;position:relative}
.bnav button svg{width:21px;height:21px}
.bnav button.on{color:var(--accent2)}
.bnav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent2)}
.bnav .badge{position:absolute;top:6px;right:50%;margin-right:-22px;background:var(--accent);
  color:#fff;font-size:9.5px;font-weight:600;padding:0 5px;border-radius:99px;min-width:16px;
  line-height:16px;text-align:center}

/* ---------- blocks ---------- */
.card{background:linear-gradient(165deg,rgba(185,162,255,.08),rgba(185,162,255,.025));
  border:1px solid var(--line);border-radius:20px;padding:18px;
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -16px rgba(0,0,0,.7)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt{margin-top:12px}
.muted{color:var(--muted)}
.sm{font-size:13px} .xs{font-size:11.5px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  margin:22px 0 10px;font-weight:650}
h2.sec:first-child{margin-top:4px}

.stat{background:linear-gradient(165deg,rgba(185,162,255,.08),rgba(185,162,255,.025));
  border:1px solid var(--line);border-radius:18px;padding:15px}
.stat .n{font-size:28px;font-weight:680;letter-spacing:-.035em;line-height:1.1;margin:3px 0 2px}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat .s{font-size:11.5px;color:var(--muted)}

.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:none;transform:rotate(-90deg)}
.ring .mid{position:relative}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;transform:none}
.ring .val b{font-size:22px;font-weight:680;letter-spacing:-.03em;line-height:1}
.ring .val span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

.sbar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:rgba(185,162,255,.1)}
.sbar i{display:block;height:100%}
.leg{display:flex;flex-direction:column;gap:7px;margin-top:13px}
.leg .r{display:flex;align-items:center;gap:9px;font-size:13px}
.leg .r b{margin-left:auto;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:99px;flex:none}

/* chips: geser mendatar tanpa menggeser halaman */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 2px;margin:0 -18px 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;background:rgba(185,162,255,.08);
  border:1px solid var(--line);color:var(--muted);font-size:13.5px;white-space:nowrap;
  min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:rgba(139,92,246,.3);color:var(--text);border-color:var(--line2);font-weight:560}
.chip .c{font-size:11px;opacity:.75}

/* kartu konten */
.list{display:grid;gap:11px;grid-template-columns:minmax(0,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:14px 15px;text-align:left;width:100%;min-width:0;max-width:100%;display:block;
  transition:.15s;position:relative;overflow:hidden}
.tile:active{transform:scale(.985);border-color:var(--line2)}
.tile .hd{display:flex;align-items:flex-start;gap:11px}
.tile .nm{flex:1;min-width:0;font-weight:570;font-size:14.5px;line-height:1.35;
  overflow-wrap:anywhere}
.tile .meta{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.plat{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:rgba(185,162,255,.1);border:1px solid var(--line);font-size:11px;font-weight:700;
  letter-spacing:-.02em}
.plat.ig{background:linear-gradient(140deg,rgba(214,41,118,.3),rgba(253,200,75,.22));
  border-color:rgba(214,41,118,.4)}
.plat.tt{background:rgba(37,244,238,.14);border-color:rgba(37,244,238,.3)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:560;
  padding:5px 11px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.pill.tap{min-height:34px;padding:6px 13px}
.pill:active{filter:brightness(1.2)}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(185,162,255,.09);
  color:var(--muted);border:1px solid var(--line);white-space:nowrap}

/* segmented ACC */
.seg{display:flex;gap:5px;background:rgba(10,8,16,.5);border:1px solid var(--line);
  border-radius:13px;padding:4px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:12.5px;font-weight:560;
  color:var(--muted);transition:.14s;padding:0 4px}
.seg button.on{color:#fff}
.seg button:active{transform:scale(.96)}

.empty{text-align:center;padding:40px 18px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:5px;font-weight:580}
.banner{border:1px solid rgba(251,113,133,.38);background:rgba(251,113,133,.1);
  border-radius:16px;padding:15px;margin-bottom:16px;font-size:13.5px}
.banner b{display:block;margin-bottom:4px}

/* ---------- bottom sheet ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(6,4,12,.66);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:86vh;overflow-y:auto;
  pointer-events:auto;
  background:linear-gradient(180deg,#221A3A,#171226);border:1px solid var(--line2);
  border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-b));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  -webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:99px;background:rgba(185,162,255,.3);
  margin:0 auto 16px}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-.02em;line-height:1.3}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-radius:15px;
  background:rgba(185,162,255,.05);border:1px solid var(--line);margin-bottom:9px;
  font-size:15px;text-align:left;min-height:54px;transition:.14s}
.opt:active{transform:scale(.985)}
.opt.on{background:rgba(139,92,246,.24);border-color:var(--accent)}
.opt .ck{margin-left:auto;color:var(--accent2);font-size:17px}
.kv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(185,162,255,.08);
  font-size:13.5px}
.kv .k{color:var(--muted);width:104px;flex:none;font-size:12.5px}
.kv .v{flex:1;min-width:0;word-break:break-word}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;
  border-radius:15px;font-size:15px;font-weight:600;
  background:linear-gradient(145deg,var(--accent),#7048E8);color:#fff;margin-top:6px}
.btn.ghost{background:rgba(185,162,255,.08);border:1px solid var(--line);font-weight:500}
.btn:active{transform:scale(.99)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:90;
  transform:translate(-50%,120px);background:#2A2145;border:1px solid var(--line2);
  padding:12px 20px;border-radius:99px;font-size:13.5px;transition:transform .26s;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.8);max-width:88vw;text-align:center}
.toast.on{transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media(min-width:900px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:238px;flex:none;padding:20px 12px;
    background:rgba(16,13,24,.8);backdrop-filter:blur(18px);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
  .brand .mark{width:27px;height:21px;color:#fff;flex:none;
    filter:drop-shadow(0 0 10px rgba(185,162,255,.5))}
  .brand b{font-size:14.5px;font-weight:650;line-height:1.2;letter-spacing:-.02em}
  .side .nav{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;
    color:var(--muted);font-size:14px;text-align:left;width:100%}
  .side .nav svg{width:17px;height:17px;flex:none}
  .side .nav:hover{background:rgba(185,162,255,.06);color:var(--text)}
  .side .nav.on{background:linear-gradient(90deg,rgba(139,92,246,.24),rgba(139,92,246,.06));
    color:var(--text);font-weight:560;box-shadow:inset 0 0 0 1px var(--line2)}
  .side .nav .c{margin-left:auto;font-size:11px;background:rgba(185,162,255,.12);
    padding:1px 8px;border-radius:99px}
  .side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
  .page{padding:26px;padding-bottom:40px}
  .top{padding:16px 26px}
  .chips{margin:0 0 16px;padding:2px 0;overflow-x:visible;flex-wrap:wrap}
  .g2{grid-template-columns:repeat(4,minmax(0,1fr))}
  .list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .ov.on{display:block}
  .sheet{left:50%;bottom:auto;top:50%;right:auto;width:min(520px,92vw);
    transform:translate(-50%,-44%) scale(.97);opacity:0;border-radius:22px;border-bottom:1px solid var(--line2);
    padding:22px 24px 24px;transition:.2s}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .grab{display:none}
  .toast{bottom:26px}
}
@media(min-width:1280px){ .list{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>
</head>
<body>

<div class="wrap">
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 80" fill="currentColor" aria-hidden="true">
        <path d="M30 0H60V21H21V57H0V30Z"/><path d="M62 24H100V57L77 80H23V59H79V45H62Z"/>
      </svg><b>Project<br>Media Sosial</b></div>
    <div id="sideNav"></div>
    <div class="foot">
      <button class="nav" id="refreshD">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
        Muat ulang</button>
      <button class="nav" id="logoutD">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Keluar</button>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="ttl"><h1 id="ptitle">Ringkasan</h1>
        <div class="sub" id="psub">Project Media Sosial</div></div>
      <button class="sync" id="sync"><i></i><span>memuat</span></button>
    </header>
    <div class="page" id="view"></div>
  </main>
</div>

<nav class="bnav" id="bnav"></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2400)}
function buzz(){ try{navigator.vibrate&&navigator.vibrate(8)}catch{} }

/* ===== model ===== */
const TAB_SS='Senthong jawi & sengaja', TAB_DL='Deselokaton';
const C={ref:1,status:2,konsep:3,nomor:4,catatan:5,ig:6,tiktok:7,
         no:8,delivered:9,file:10,upload:11,ket:12,acc:13};
const PROD=['Belum dikerjakan','Done take','Done edit','Upload'];
const PLBL={'Belum dikerjakan':'Belum dikerjakan','Done take':'Sudah di-take',
            'Done edit':'Sudah di-edit','Upload':'Sudah tayang'};
const PCLR={'Belum dikerjakan':'#A49CB4','Done take':'#C084FC',
            'Done edit':'#60A5FA','Upload':'#4ADE80'};
const ACC=['Pending','Revisi','ACC'];
const ALBL={Pending:'Menunggu',Revisi:'Revisi',ACC:'ACC'};
const ACLR={Pending:'#A49CB4',Revisi:'#FB7185',ACC:'#4ADE80'};
const soft=h=>h+'26';

let content=[],delivery=[],loadErr='';
const normProd=v=>{const s=String(v||'').trim();
  if(!s)return'Belum dikerjakan'; if(/belum/i.test(s))return'Belum dikerjakan';
  if(/done\s*take/i.test(s))return'Done take'; if(/done\s*edit/i.test(s))return'Done edit';
  if(/upload/i.test(s))return'Upload'; return s};
const cell=(r,i)=>String((r&&r[i-1])||'').trim();

function parse(tabs){
  const ss=tabs[TAB_SS]||[], dl=tabs[TAB_DL]||[], out=[];
  let brand='Senthong Jawi';
  ss.forEach((r,i)=>{const a=cell(r,C.ref); if(!a)return;
    if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(a))return;
    if(/^referensi/i.test(a)){brand=/sengaja/i.test(a)?'Sengaja':'Senthong Jawi';return}
    out.push(mk(TAB_SS,i+1,brand,r,cell(r,C.tiktok)))});
  dl.forEach((r,i)=>{const a=cell(r,C.ref); if(!a)return;
    if(/^\(?\s*minggu/i.test(a)||/^referensi/i.test(a))return;
    out.push(mk(TAB_DL,i+1,'Deselokaton',r,''))});
  content=out;

  const d=[];
  dl.forEach((r,i)=>{const no=cell(r,C.no); if(!/^\d+$/.test(no))return;
    const ket=cell(r,C.ket), a=cell(r,C.acc);
    d.push({tab:TAB_DL,row:i+1,no:+no,delivered:cell(r,C.delivered),
      file:cell(r,C.file),upload:cell(r,C.upload),ket,
      acc:ACC.includes(a)?a:(a?a:(/done\s*send/i.test(ket)?'ACC':'Pending'))})});
  delivery=d.sort((a,b)=>a.no-b.no);
}
function mk(tab,row,brand,r,tiktok){
  return {tab,row,brand,ref:cell(r,C.ref),status:normProd(cell(r,C.status)),
    konsep:cell(r,C.konsep),nomor:cell(r,C.nomor),catatan:cell(r,C.catatan),
    ig:cell(r,C.ig),tiktok,key:tab+':'+row};
}
const platOf=u=>/tiktok/i.test(u)?'tt':/instagram/i.test(u)?'ig':'';
const urlOf=c=>{const m=String(c.ref).match(/https?:\/\/\S+/i);return m?m[0]:''};
function shortRef(c){
  const u=String(c.ref);
  let m=u.match(/instagram\.com\/(reel|p)\/([\w-]{6,})/i);
  if(m)return (m[1].toLowerCase()==='p'?'Post ':'Reel ')+m[2].slice(0,9);
  m=u.match(/tiktok\.com\/[^/]*\/?video\/(\d{6,})/i);
  if(m)return 'TikTok '+m[1].slice(-6);
  if(/vt\.tiktok\.com\/([\w]+)/i.test(u))return 'TikTok '+RegExp.$1.slice(0,8);
  return '';
}
function titleOf(c){
  if(c.konsep)return c.konsep;
  if(c.nomor)return c.nomor;
  const s=shortRef(c);
  if(s)return s;
  const m=String(c.ref).match(/^\s*(\d+)[.\s]/);
  return m?'Referensi '+m[1]:String(c.ref).slice(0,40);
}
function subOf(c){
  const bits=[c.brand];
  if(c.nomor&&c.konsep)bits.push(c.nomor);
  else{const s=shortRef(c); if(s&&titleOf(c)!==s)bits.push(s)}
  return bits.join(' · ');
}

/* ===== jembatan ===== */
function setSync(st,txt){const e=$('#sync');e.className='sync'+(st?' '+st:'');
  e.querySelector('span').textContent=txt}
async function load(silent){
  if(!silent)setSync('busy','memuat');
  try{
    const r=await fetch('/api/cece/sheet');
    if(r.status===401){location.href='/login?next=/dash/cece/';return}
    const j=await r.json();
    if(j.error){loadErr=j.error;setSync('err','terputus');render();return}
    loadErr=''; parse(j.tabs);
    setSync('', new Date(j.at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
    render();
  }catch{ loadErr='network'; setSync('err','terputus'); render() }
}
async function push(edits,label){
  setSync('busy','menyimpan');
  try{
    const r=await fetch('/api/cece/sheet',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({edits})});
    const j=await r.json();
    if(j.error){setSync('err','gagal');toast('Gagal menyimpan — coba lagi');await load(true);return false}
    buzz(); toast(label||'Tersimpan'); await load(true); return true;
  }catch{ setSync('err','gagal'); toast('Gagal terhubung'); return false }
}

/* ===== nav ===== */
const ICO={overview:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 7h8V3h-8zM3 21h8v-4H3z"/>',
  konten:'<path d="M4 5h16v14H4z"/><path d="M4 15l4.5-4.5 3 3L15 10l5 5"/><circle cx="9" cy="9" r="1.3"/>',
  acc:'<path d="M9 11l2 2 4-4"/><path d="M4 5h16v16H4z"/>'};
const NAV=[{id:'overview',label:'Ringkasan'},
  {id:'konten',label:'Konten',count:()=>content.length},
  {id:'acc',label:'ACC',count:()=>delivery.filter(d=>d.acc!=='ACC').length}];
const TT={overview:['Ringkasan','Project Media Sosial'],
  konten:['Konten','Semua referensi & statusnya'],
  acc:['Delivery & ACC','Deselokaton']};
let route='overview', brandF='all', prodF='all';

function renderNav(){
  $('#bnav').innerHTML=NAV.map(n=>{const c=n.count?n.count():0;
    return `<button data-go="${n.id}" class="${route===n.id?'on':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">${ICO[n.id]}</svg>${n.label}
      ${c?`<span class="badge">${c}</span>`:''}</button>`}).join('')+
    `<button data-act="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>Muat</button>`;
  $('#sideNav').innerHTML=NAV.map(n=>{const c=n.count?n.count():0;
    return `<button class="nav ${route===n.id?'on':''}" data-go="${n.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">${ICO[n.id]}</svg>${n.label}
      ${c?`<span class="c">${c}</span>`:''}</button>`}).join('');
}
function go(r){route=r;window.scrollTo(0,0);render()}

function render(){
  renderNav();
  $('#ptitle').textContent=TT[route][0];
  $('#psub').textContent=TT[route][1];
  $('#view').innerHTML=loadErr?vErr():
    ({overview:vOverview,konten:vKonten,acc:vAcc}[route])();
}
function vErr(){
  const m={sheet_not_configured:'Variable CECE_SHEET_URL atau CECE_SHEET_TOKEN belum dipasang di Cloudflare.',
    bridge_unreachable:'Apps Script tidak bisa dihubungi.',
    bridge_bad_response:'Deployment Apps Script belum disetel ke "Anyone".',
    unauthorized:'Token jembatan tidak cocok.',network:'Jaringan bermasalah.'}[loadErr]||loadErr;
  return `<div class="banner"><b>Belum terhubung ke spreadsheet</b>${esc(m)}</div>
    <div class="card"><div class="empty"><b>Belum ada data</b>
      Perbaiki koneksinya lalu tekan Muat.</div></div>`;
}

/* ===== RINGKASAN ===== */
function vOverview(){
  const accN=delivery.filter(d=>d.acc==='ACC').length;
  const revN=delivery.filter(d=>d.acc==='Revisi').length;
  const penN=delivery.length-accN-revN;
  const pct=delivery.length?Math.round(accN/delivery.length*100):0;
  const n=s=>content.filter(c=>c.status===s).length;
  const blm=n('Belum dikerjakan');
  const R=42, CIRC=2*Math.PI*R;

  return `
  <div class="card">
    <div class="ring">
      <div class="mid" style="position:relative;width:104px;height:104px">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="${R}" fill="none" stroke="rgba(185,162,255,.13)" stroke-width="11"/>
          <circle cx="52" cy="52" r="${R}" fill="none" stroke="${ACLR.ACC}" stroke-width="11"
            stroke-linecap="round" stroke-dasharray="${CIRC}"
            stroke-dashoffset="${CIRC-CIRC*pct/100}"/>
        </svg>
        <div class="val"><b>${pct}%</b><span>ACC</span></div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:600">${accN} dari ${delivery.length} video</div>
        <div class="sm muted" style="margin-top:2px">sudah disetujui</div>
        <div class="leg" style="margin-top:12px">
          ${lg(ACLR.ACC,'Sudah ACC',accN)}
          ${revN?lg(ACLR.Revisi,'Minta revisi',revN):''}
          ${penN?lg(ACLR.Pending,'Menunggu dicek',penN):''}
        </div>
      </div>
    </div>
  </div>

  <h2 class="sec">Produksi</h2>
  <div class="grid g2">
    ${st('Belum di-take',blm,'perlu dikerjakan',blm?'var(--danger)':null)}
    ${st('Sudah di-take',n('Done take'),'menunggu edit')}
    ${st('Sudah di-edit',n('Done edit'),'siap kirim')}
    ${st('Sudah tayang',n('Upload'),'sudah posting','var(--ok)')}
  </div>

  <h2 class="sec">Sebaran status</h2>
  <div class="card">
    <div class="sbar">${PROD.map(s=>{const v=n(s);
      return v?`<i style="width:${v/content.length*100}%;background:${PCLR[s]}"></i>`:''}).join('')}</div>
    <div class="leg">${PROD.map(s=>lg(PCLR[s],PLBL[s],n(s))).join('')}</div>
    <button class="btn ghost mt" data-go="konten">Lihat semua konten</button>
  </div>

  <h2 class="sec">Per brand</h2>
  <div class="list">
    ${[...new Set(content.map(c=>c.brand))].map(b=>{
      const it=content.filter(c=>c.brand===b);
      const up=it.filter(c=>c.status==='Upload').length;
      const bl=it.filter(c=>c.status==='Belum dikerjakan').length;
      return `<button class="tile" data-brand-go="${esc(b)}">
        <div class="between"><span style="font-weight:600;font-size:15px">${esc(b)}</span>
          <span class="tag">${it.length} konten</span></div>
        <div class="sbar" style="margin-top:12px">${PROD.map(s=>{
          const v=it.filter(c=>c.status===s).length;
          return v?`<i style="width:${v/it.length*100}%;background:${PCLR[s]}"></i>`:''}).join('')}</div>
        <div class="row" style="margin-top:11px;gap:7px">
          <span class="tag" style="color:${PCLR.Upload}">${up} tayang</span>
          ${bl?`<span class="tag" style="color:${PCLR['Belum dikerjakan']}">${bl} belum</span>`:''}
        </div></button>`}).join('')}
  </div>`;
}
function st(l,v,s,clr){return `<div class="stat"><div class="l">${l}</div>
  <div class="n"${clr?` style="color:${clr}"`:''}>${v}</div><div class="s">${s}</div></div>`}
function lg(c,l,v){return `<div class="r"><span class="dot" style="background:${c}"></span>
  ${l}<b>${v}</b></div>`}

/* ===== KONTEN ===== */
function vKonten(){
  const brands=[...new Set(content.map(c=>c.brand))];
  let pool=content.filter(c=>(brandF==='all'||c.brand===brandF)&&
    (prodF==='all'||c.status===prodF));
  pool=pool.sort((a,b)=>PROD.indexOf(a.status)-PROD.indexOf(b.status));

  return `
  <div class="chips">
    <button class="chip${brandF==='all'?' on':''}" data-brand="all">Semua brand</button>
    ${brands.map(b=>`<button class="chip${brandF===b?' on':''}" data-brand="${esc(b)}">${esc(b)}
      <span class="c">${content.filter(c=>c.brand===b).length}</span></button>`).join('')}
  </div>
  <div class="chips">
    <button class="chip${prodF==='all'?' on':''}" data-prod="all">Semua status</button>
    ${PROD.map(s=>{const v=content.filter(c=>(brandF==='all'||c.brand===brandF)&&c.status===s).length;
      return `<button class="chip${prodF===s?' on':''}" data-prod="${esc(s)}">
        <span class="dot" style="background:${PCLR[s]}"></span>${PLBL[s]}
        <span class="c">${v}</span></button>`}).join('')}
  </div>
  ${pool.length?`<div class="list">${pool.map(tile).join('')}</div>`
    :`<div class="card"><div class="empty"><b>Tidak ada konten</b>
       Coba ganti filternya di atas.</div></div>`}`;
}
function tile(c){
  const p=platOf(c.ref);
  const posted=c.ig||c.tiktok;
  return `<button class="tile" data-open="${c.key}">
    <div class="hd">
      <span class="plat ${p}">${p==='tt'?'TT':p==='ig'?'IG':'—'}</span>
      <span class="nm"><span class="clamp">${esc(titleOf(c))}</span>
        <span class="meta">${esc(subOf(c))}</span></span>
    </div>
    <div class="row" style="margin-top:12px;gap:7px">
      <span class="pill" style="background:${soft(PCLR[c.status])};color:${PCLR[c.status]};
        border-color:${soft(PCLR[c.status])}">
        <span class="dot" style="background:${PCLR[c.status]}"></span>${PLBL[c.status]||esc(c.status)}</span>
      ${posted?'<span class="tag">sudah diposting</span>':''}
    </div></button>`;
}

/* ===== ACC ===== */
function vAcc(){
  const accN=delivery.filter(d=>d.acc==='ACC').length;
  const belum=delivery.length-accN;
  return `
  <div class="grid g2" style="margin-bottom:6px">
    ${st('Sudah ACC',accN,'dari '+delivery.length+' video','var(--ok)')}
    ${st('Belum ACC',belum,'menunggu kamu',belum?'var(--warn)':null)}
  </div>
  <h2 class="sec">Daftar video</h2>
  ${delivery.length?`<div class="list">${delivery.map(dTile).join('')}</div>`
    :`<div class="card"><div class="empty"><b>Belum ada video</b>
       Slot delivery belum terisi di sheet.</div></div>`}`;
}
function dTile(d){
  return `<div class="tile">
    <div class="hd">
      <span class="plat" style="font-size:13px">${d.no}</span>
      <span class="nm">${esc(d.file||'Video '+d.no)}
        <span class="meta">${d.upload?'Upload '+esc(d.upload)
          :d.delivered?'Dikirim '+esc(d.delivered):'Belum ada tanggal'}</span></span>
    </div>
    <div class="seg" style="margin-top:13px">
      ${ACC.map(a=>`<button data-acc="${d.tab}:${d.row}" data-val="${a}"
        class="${d.acc===a?'on':''}"
        ${d.acc===a?`style="background:${soft(ACLR[a])};box-shadow:inset 0 0 0 1px ${ACLR[a]}66;color:${ACLR[a]}"`:''}
        >${ALBL[a]}</button>`).join('')}
    </div></div>`;
}

/* ===== bottom sheet ===== */
let sheetOpen=null;
function openSheet(html){ $('#sheet').innerHTML='<div class="grab"></div>'+html;
  $('#sheet').classList.add('on'); $('#ov').classList.add('on');
  document.body.style.overflow='hidden' }
function closeSheet(){ sheetOpen=null; $('#sheet').classList.remove('on');
  $('#ov').classList.remove('on'); document.body.style.overflow='' }

function detail(key){
  const c=content.find(x=>x.key===key); if(!c)return;
  sheetOpen=key;
  const link=urlOf(c);
  openSheet(`
    <h3>${esc(titleOf(c))}</h3>
    <div class="sub">${esc(c.brand)}</div>
    <div class="kv"><span class="k">Status</span><span class="v">
      <span class="pill" style="background:${soft(PCLR[c.status])};color:${PCLR[c.status]}">
        ${PLBL[c.status]||esc(c.status)}</span></span></div>
    ${c.nomor?`<div class="kv"><span class="k">Penomoran</span><span class="v">${esc(c.nomor)}</span></div>`:''}
    ${c.konsep?`<div class="kv"><span class="k">Konsep</span><span class="v">${esc(c.konsep)}</span></div>`:''}
    ${c.catatan?`<div class="kv"><span class="k">Catatan</span><span class="v">${esc(c.catatan)}</span></div>`:''}
    <div class="kv"><span class="k">Referensi</span><span class="v">${
      link?`<a href="${esc(link)}" target="_blank" rel="noopener">Buka referensi ↗</a>`
      :esc(c.ref)}</span></div>
    ${c.ig?`<div class="kv"><span class="k">Instagram</span><span class="v">
      <a href="${esc(c.ig)}" target="_blank" rel="noopener">Lihat postingan ↗</a></span></div>`:''}
    ${c.tiktok?`<div class="kv"><span class="k">TikTok</span><span class="v">
      <a href="${esc(c.tiktok)}" target="_blank" rel="noopener">Lihat postingan ↗</a></span></div>`:''}
    <button class="btn" data-chstatus="${c.key}" style="margin-top:18px">Ubah status</button>
    <button class="btn ghost" data-close>Tutup</button>`);
}
function statusSheet(key){
  const c=content.find(x=>x.key===key); if(!c)return;
  openSheet(`<h3>Ubah status</h3><div class="sub">${esc(titleOf(c))}</div>
    ${PROD.map(s=>`<button class="opt ${c.status===s?'on':''}" data-setstatus="${c.key}" data-val="${esc(s)}">
      <span class="dot" style="background:${PCLR[s]};width:11px;height:11px"></span>
      ${PLBL[s]}${c.status===s?'<span class="ck">✓</span>':''}</button>`).join('')}
    <button class="btn ghost" data-close style="margin-top:10px">Batal</button>`);
}

/* ===== events ===== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-go],[data-act],[data-brand],[data-prod],[data-brand-go],[data-open],[data-acc],[data-chstatus],[data-setstatus],[data-close]');
  if(!t)return;
  const d=t.dataset;

  if(d.close!==undefined)return closeSheet();
  if(d.go){closeSheet();return go(d.go)}
  if(d.act==='refresh'){buzz();return load()}
  if(d.brand!==undefined&&t.hasAttribute('data-brand')){brandF=d.brand;prodF='all';return render()}
  if(d.prod!==undefined&&t.hasAttribute('data-prod')){prodF=d.prod;return render()}
  if(d.brandGo){brandF=d.brandGo;prodF='all';return go('konten')}
  if(d.open)return detail(d.open);
  if(d.chstatus)return statusSheet(d.chstatus);

  if(d.setstatus){
    const c=content.find(x=>x.key===d.setstatus);
    closeSheet();
    if(!c||c.status===d.val)return;
    return void push([{tab:c.tab,row:c.row,col:C.status,value:d.val}],
      'Status → '+(PLBL[d.val]||d.val));
  }
  if(d.acc){
    const [tab,row]=d.acc.split(':');
    const cur=delivery.find(x=>x.tab===tab&&x.row===+row);
    if(!cur||cur.acc===d.val)return;
    // Tandai langsung supaya terasa responsif, lalu simpan.
    t.parentElement.querySelectorAll('button').forEach(b=>{
      b.classList.remove('on'); b.removeAttribute('style')});
    t.classList.add('on');
    t.style.cssText=`background:${soft(ACLR[d.val])};box-shadow:inset 0 0 0 1px ${ACLR[d.val]}66;color:${ACLR[d.val]}`;
    return void push([{tab,row:+row,col:C.acc,value:d.val}],'Ditandai '+ALBL[d.val]);
  }
});
$('#ov').onclick=closeSheet;
$('#refreshD').onclick=()=>load();
const logout=async()=>{await fetch('/api/session',{method:'DELETE'});location.href='/login'};
$('#logoutD').onclick=logout;
$('#sync').onclick=()=>load();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* geser sheet ke bawah untuk menutup */
(function(){
  const sh=$('#sheet'); let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{ if(sh.scrollTop>0)return; y0=e.touches[0].clientY; dy=0 },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0===null)return;
    dy=e.touches[0].clientY-y0;
    if(dy>0){sh.style.transition='none';sh.style.transform='translateY('+dy+'px)'} },{passive:true});
  sh.addEventListener('touchend',()=>{ if(y0===null)return;
    sh.style.transition=''; sh.style.transform='';
    if(dy>90)closeSheet(); y0=null });
})();

render(); load();
setInterval(()=>{ if(!document.hidden&&!sheetOpen) load(true) },60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(true) });
</script>
</body>
</html>
